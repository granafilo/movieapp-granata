            <div class="navbar-start">
                <label for="navbar-1-toggle" class="btn btn-ghost lg:hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h8m-8 6h16" />
                    </svg>
                </label>
                <button id="headerLogo" onclick="" class="btn p-3 overflow-hidden rounded-full">
                    <a href="/index.html" class="w-full h-full">
                        <img src="favicon.svg" class="object-fit w-full h-full" alt="">
                    </a>
                </button>
            </div>
            <div class="navbar-end hidden lg:flex">
                <ul class="menu menu-horizontal px-1 font-semibold text-xl">
                    <li><a href="movies.html"><button class="rounded-full">MOVIES</button></a></li>
                    <li><a href="serie.html"><button class="rounded-full">SERIE</button></a></li>
                    <li><a href="profile.html"><button class="rounded-full">PROFILO</button></a></li>
                </ul>
            </div>
        </div>

        <div class="collapse-content lg:hidden z-1">
            <ul class="menupx-1 font-normal text-md">
                <li class=""><a href="movies.html"><button class="rounded-full">MOVIES</button></a></li>
                <li class="mt-2.5"><a href="serie.html"><button class="rounded-full">SERIE</button></a></li>
                <li class="mt-2.5"><a href="profile.html"><button class="rounded-full">PROFILO</button></a></li>
            </ul>
        </div>
    </header>
    <main class="flex-1 bg-[#fafafa]">
        <section id="heroSection">
            <div id="heroWrapper" class="hero min-h-120">
                <div id="heroOverlay" class="hero-overlay bg-[#1c2431]"></div>
                <div
                    class="hero-content h-full text-neutral-content lg:max-w-300 w-full !justify-start p-[15px_0_15px_0]">
                    <div class="h-full w-3/12 flex items-center">
                        <figure id="posterWrapper" class="w-full h-full">
                        </figure>
                    </div>
                    <div class="w-9/12 h-full">
                        <h1 id="heroTitle" class="mb-2 text-4xl font-extrabold">Titolo Film </h1>
                        <div id="movieInfo" class="flex gap-2 mb-2"></div>
                        <div class="relative flex items-center justify-center w-17 h-17 bg-[#1c2431] rounded-full mb-2">
                            <svg class="w-full h-full transform -rotate-90">
                                <circle cx="35" cy="35" r="30" class="stroke-[#1e4229]" stroke-width="4"
                                    fill="transparent" />
                                <circle id="movie-progress" cx="35" cy="35" r="30"
                                    class="stroke-[#21d07a] transition-all duration-1000 ease-out" stroke-width="4"
                                    fill="transparent" stroke-linecap="round" />
                            </svg>
                            <div class="absolute text-white font-bold text-2xl flex font-sans">
                                <span id="movie-rating-text" class="">0</span>
                                <span class="text-[7px] text-gray-300 absolute -right-2 top-1">%</span>
                            </div>
                        </div>
                        <p id="heroOverview" class="mb-5">Overview</p>
                        <button
                            class="p-3 bg-red-900 border-0 hover:bg-red-950 rounded-3xl cursor-pointer transition-all duration-300">Guarda
                            <span class="text-yellow-600">Subito!</span></button>
                    </div>
                </div>
            </div>
        </section>
        <section class="text-black flex w-full justify-center">
            <div class="lg:max-w-300 w-full mt-3">
                <h3 class="font-bold text-3xl">Attori in Primo Piano!</h3>
                <div id="popularActor" class="mt-5 flex overflow-x-scroll gap-8">
                    <div class="card w-36 h-70 shadow-sm">
                        <figure class="h-8/12 w-full">
                            <img src="https://image.tmdb.org/t/p/original/8nytsqL59SFJTVYVrN72k6qkGgJ.jpg"
                                alt="Shoes" class="w-full h-full object-cover" />
                        </figure>
                        <div class="card-body h-4/12 p-2">
                            <h2 class="card-title">Nome</h2>
                            <p>Ruolo</p>
                        </div>
                    </div>
                </div>
            </div>


        </section>
    </main>
