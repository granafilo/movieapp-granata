<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />

<body>
  <header class="max-lg:collapse bg-base-200 shadow-sm w-full rounded-md">
    <input id="navbar-1-toggle" class="peer hidden" type="checkbox" />
    <label for="navbar-1-toggle" class="fixed inset-0 hidden max-lg:peer-checked:block"></label>
    <div class="collapse-title navbar">
      <div class="navbar-start">
        <label for="navbar-1-toggle" class="btn btn-ghost lg:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
          </svg>
        </label>
        <button id="headerLogo" onclick="" class="btn p-3 overflow-hidden rounded-full">
          <a href="/index.html" class="w-full h-full">
            <img src="favicon.svg" class="object-fit w-full h-full" alt="">
          </a>
        </button>
      </div>
      <div class="navbar-end hidden lg:flex">
        <ul class="menu menu-horizontal px-1 font-semibold text-xl">
          <li><a href="movies.html"><button class="rounded-full">MOVIES</button></a></li>
          <li><a href="serie.html"><button class="rounded-full">SERIE</button></a></li>
          <li><a href="profile.html"><button class="rounded-full">PROFILO</button></a></li>
        </ul>
      </div>
    </div>

    <div class="collapse-content lg:hidden z-1">
      <ul class="menupx-1 font-normal text-md">
        <li class=""><a href="movies.html"><button class="rounded-full">MOVIES</button></a></li>
        <li class="mt-2.5"><a href="serie.html"><button class="rounded-full">SERIE</button></a></li>
        <li class="mt-2.5"><a href="profile.html"><button class="rounded-full">PROFILO</button></a></li>
      </ul>
    </div>
  </header>
  <main class="flex-1">
    <!-- Hero Section -->
    <section id="heroSection">
      <div id="heroWrapper" class="hero min-h-160 ">
        <div class="hero-overlay"></div>
        <div class="hero-content text-neutral-content lg:max-w-[1200px] w-full !justify-start">
          <div class="max-w-md backdrop-grayscale-50">
            <h1 id="heroTitle" class="mb-5 text-5xl font-bold">Titolo Film</h1>
            <p id="heroOverview" class="mb-5">Overview</p>
            <button
              class="p-3 bg-red-900 border-0 hover:bg-red-950 rounded-3xl cursor-pointer transition-all duration-300">Guarda
              <span class="text-yellow-600">Subito!</span></button>
          </div>
        </div>
      </div>
    </section>
    <!-- Alti film da vedere -->
    <section class="mx-auto max-w-[1200px]">
      <div class="m-4">
        <h2 class="font-bold text-2xl">Altri film da Guardare!</h2>
        <!-- container slider -->
        <div id="watchNext" class="mt-5 pb-3 flex overflow-x-scroll gap-8">
        </div>
      </div>
    </section>
    <section class="mx-auto max-w-[1200px]">
      <div class="m-4">
        <h2 class="font-bold text-2xl">Attori in hype al momento!</h2>
        <!-- container slider -->
        <div id="popularActor" class="mt-5 pb-3 flex overflow-x-scroll gap-8"></div>
      </div>
    </section>
  </main>
